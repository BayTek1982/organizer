<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bayazit Organizer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0e14; --bg2:#0f141c; --card:#121925; --card2:#172030; --line:#1f2a3a; --line2:#2a3850;
  --txt:#e6edf6; --mut:#8a98ad; --dim:#5d6b80;
  --doc:#4da3ff; --xls:#2ecc71; --note:#f5b942; --mail:#a78bfa; --web:#22d3ee; --dir:#e879f9; --fav:#f472b6; --home:#ff8a3d;
  --danger:#ff5d5d; --shadow:0 10px 30px rgba(0,0,0,.35);
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace; --sans:'Inter',system-ui,Segoe UI,sans-serif;
}
body.light{
  --bg:#f3f5f9; --bg2:#e9edf3; --card:#ffffff; --card2:#f6f8fb; --line:#dde3ec; --line2:#c9d2df;
  --txt:#121826; --mut:#5a6578; --dim:#8a94a6; --shadow:0 8px 24px rgba(20,30,50,.08);
  --doc:#1f7ae0; --xls:#16a34a; --note:#c98a06; --mail:#7c3aed; --web:#0891b2; --dir:#c026d3; --fav:#db2777; --home:#ea580c;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:14px;display:grid;grid-template-columns:250px 1fr;min-width:900px}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(900px 500px at 85% -10%,rgba(77,163,255,.08),transparent 60%),radial-gradient(700px 400px at 10% 110%,rgba(46,204,113,.06),transparent 60%)}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
/* Sidebar */
aside{position:sticky;top:0;height:100vh;background:var(--bg2);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:4px;z-index:2}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px}
.logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--home),var(--fav));display:grid;place-items:center;font-family:var(--mono);font-weight:700;color:#fff;font-size:15px}
.brand b{font-family:var(--mono);font-size:15px;letter-spacing:.5px;display:block}
.brand small{color:var(--mut);font-size:11px;font-family:var(--mono)}
.nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:1px solid transparent;background:none;text-align:left;width:100%;color:var(--mut);font-weight:500}
.nav:hover{background:var(--card);color:var(--txt)}
.nav.on{background:var(--card);border-color:var(--line2);color:var(--txt)}
.nav .dot{width:9px;height:9px;border-radius:3px;background:var(--c)}
.nav .n{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--dim)}
.sep{height:1px;background:var(--line);margin:12px 6px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px}
.status{font-family:var(--mono);font-size:11px;color:var(--mut);padding:8px 12px;border:1px dashed var(--line2);border-radius:10px;line-height:1.5}
.status i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--xls);margin-right:6px}
.status.local i{background:var(--note)}
/* Einklappen */
body{transition:grid-template-columns .22s ease}
.sideBtn{margin-left:auto;width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--mut);display:grid;place-items:center;flex:none}
.sideBtn:hover{color:var(--txt);border-color:var(--line2)}
.sideBtn svg{transition:transform .22s}
body.col{grid-template-columns:72px 1fr}
body.col aside{padding:22px 10px}
body.col .brand{flex-direction:column;padding:0 0 14px;gap:10px}
body.col .brand .bt{display:none}
body.col .sideBtn{margin:0}
body.col .sideBtn svg{transform:rotate(180deg)}
body.col .nav{font-size:0;justify-content:center;padding:11px 0;gap:0}
body.col .nav .n,body.col .status{display:none}
body.col .nav .dot{display:none}
/* Main */
main{padding:26px 34px 60px;position:relative;z-index:1;max-width:1500px;width:100%}
.top{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.search{flex:1;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 14px;height:46px}
.search:focus-within{border-color:var(--line2);box-shadow:0 0 0 3px rgba(77,163,255,.12)}
.search input{flex:1;background:none;border:0;outline:0;color:var(--txt);font:inherit;font-size:15px}
kbd{font-family:var(--mono);font-size:11px;color:var(--mut);border:1px solid var(--line2);border-bottom-width:2px;border-radius:6px;padding:2px 6px;background:var(--card2)}
.btn{height:46px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;gap:8px;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--line2);background:var(--card2)}
.btn.pri{background:var(--home);border-color:var(--home);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{height:34px;padding:0 12px;border-radius:9px;font-size:13px}
.btn.icon{width:46px;padding:0;justify-content:center}
h1{font-family:var(--mono);font-size:26px;margin:0;letter-spacing:-.3px}
.h1row{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px}
.sub{color:var(--mut);margin-top:6px}
.kicker{font-family:var(--mono);font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--c,var(--home));margin-bottom:6px}
/* Bento */
.bento{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;margin-bottom:28px}
.tile{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:150px;transition:.15s}
.tile:hover{border-color:var(--c);transform:translateY(-2px);box-shadow:var(--shadow)}
.tile:after{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:var(--c);opacity:.09}
.tile .ic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
.tile .big{font-family:var(--mono);font-size:34px;font-weight:700;margin-top:auto;line-height:1}
.tile .lbl{font-family:var(--mono);font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--mut)}
.tile.w3{grid-column:span 3}.tile.w4{grid-column:span 4}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.qb{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card2);border-radius:10px;padding:9px 10px;font-weight:600;font-size:13px;text-align:left}
.qb:hover{border-color:var(--dir);color:var(--dir)}
.qb span{color:var(--dir)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.panel h3{font-family:var(--mono);font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mut);margin:0 0 14px;display:flex;align-items:center;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
/* Items */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:500;color:var(--mut)}
.chip.on{border-color:var(--c,var(--home));color:var(--txt);background:color-mix(in srgb,var(--c,var(--home)) 12%,var(--card))}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.item{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:14px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.item:hover{border-color:var(--line2);border-left-color:var(--c)}
.ih{display:flex;align-items:center;gap:10px;min-width:0}
.ih .ic{flex:none;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c)}
.ih .t{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ih .g{font-family:var(--mono);font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:1px}
.star{margin-left:auto;background:none;border:0;color:var(--dim);font-size:18px;padding:2px 4px;line-height:1}
.star.on{color:var(--fav)}
.path{font-family:var(--mono);font-size:12px;color:var(--mut);background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:6px 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.desc{color:var(--mut);font-size:13px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.acts{display:flex;gap:6px;margin-top:2px;flex-wrap:wrap}
.act{border:1px solid var(--line);background:var(--card2);border-radius:8px;padding:5px 10px;font-size:12px;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.act:hover{border-color:var(--c);color:var(--c)}
.act.ml{margin-left:auto}
.meta{font-family:var(--mono);font-size:10.5px;color:var(--dim)}
.row{display:flex;align-items:center;gap:10px;padding:9px 6px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:8px}
.row:last-child{border-bottom:0}
.row:hover{background:var(--card2)}
.row .d{width:8px;height:8px;border-radius:2px;background:var(--c);flex:none}
.row .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .m{font-family:var(--mono);font-size:11px;color:var(--dim)}
.empty{border:1px dashed var(--line2);border-radius:16px;padding:40px;text-align:center;color:var(--mut)}
.empty b{display:block;color:var(--txt);font-size:16px;margin-bottom:6px}
.hint{font-size:12.5px;color:var(--mut);background:color-mix(in srgb,var(--c,var(--doc)) 8%,var(--card));border:1px solid color-mix(in srgb,var(--c,var(--doc)) 30%,var(--line));border-radius:12px;padding:10px 14px;margin-bottom:16px;line-height:1.5}
/* Drop */
#drop{position:fixed;inset:0;background:rgba(10,14,20,.8);display:none;place-items:center;z-index:50;font-family:var(--mono);font-size:22px;color:#fff}
#drop.on{display:grid}
#drop div{border:2px dashed var(--home);border-radius:24px;padding:60px 80px;text-align:center}
/* Modal */
.ov{position:fixed;inset:0;background:rgba(5,8,12,.6);backdrop-filter:blur(3px);display:none;place-items:center;z-index:40}
.ov.on{display:grid}
.modal{width:min(640px,92vw);max-height:90vh;overflow:auto;background:var(--card);border:1px solid var(--line2);border-radius:20px;padding:22px;box-shadow:var(--shadow)}
.modal.wide{width:min(900px,94vw)}
.modal h2{font-family:var(--mono);font-size:18px;margin:0 0 16px}
.types{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:16px}
.ty{border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--mut)}
.ty svg{color:var(--c)}
.ty.on{border-color:var(--c);color:var(--txt);background:color-mix(in srgb,var(--c) 12%,var(--card))}
label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:12px 0 6px}
input.f,textarea.f,select.f{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--txt);font:inherit;outline:0}
input.f:focus,textarea.f:focus,select.f:focus{border-color:var(--line2);box-shadow:0 0 0 3px rgba(77,163,255,.12)}
textarea.f{min-height:110px;resize:vertical;line-height:1.5}
textarea.f.note{min-height:340px;font-size:14.5px}
.mfoot{display:flex;gap:8px;margin-top:20px;align-items:center}
.mfoot .sp{flex:1}
.dz{border:2px dashed var(--line2);border-radius:14px;padding:16px;text-align:center;color:var(--txt);cursor:pointer;background:var(--bg2);line-height:1.6;transition:.15s}
.dz span{color:var(--mut);font-size:12.5px}
.dz:hover{border-color:var(--home)}
.dz.has{border-style:solid;border-color:color-mix(in srgb,var(--xls) 50%,var(--line))}
.warn{font-size:12px;color:var(--note);margin-top:6px}
.danger{color:var(--danger)!important;border-color:color-mix(in srgb,var(--danger) 40%,var(--line))!important}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(30px);opacity:0;background:var(--card2);border:1px solid var(--line2);color:var(--txt);padding:12px 18px;border-radius:12px;box-shadow:var(--shadow);transition:.25s;z-index:60;max-width:640px;font-size:13.5px;line-height:1.5}
#toast.on{opacity:1;transform:translateX(-50%)}
.clock{font-family:var(--mono);color:var(--mut);font-size:12px;text-align:right}
.clock b{display:block;color:var(--txt);font-size:22px}
</style>
</head>
<body>
<aside>
  <div class="brand"><div class="logo">BO</div><div class="bt"><b>ORGANIZER</b><small>Bayazit · PC</small></div><button class="sideBtn" id="sideBtn" title="Seitenleiste ein-/ausklappen (Strg + B)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button></div>
  <div id="nav"></div>
  <div class="side-foot">
    <button class="nav" id="themeBtn" title="Hell / Dunkel (T)"><span id="themeIc"></span><span id="themeTx">Hell</span><span class="n">T</span></button>
    <button class="nav" id="syncBtn" title="Browser-Abgleich"><span id="syIc"></span>Browser-Abgleich<span class="n"></span></button>
    <button class="nav" id="backupBtn" title="Sicherung"><span id="bkIc"></span>Sicherung<span class="n"></span></button>
    <div class="status local" id="status"><i></i>Verbinde …</div>
  </div>
</aside>

<main>
  <div class="top">
    <div class="search"><span id="sIc"></span><input id="q" placeholder="Alles durchsuchen – Dokumente, Excel, Notizen, E-Mails, Webseiten …" autocomplete="off"><kbd>Strg K</kbd></div>
    <button class="btn pri" id="addBtn"><span id="addIc"></span>Neu<kbd style="background:rgba(255,255,255,.18);color:#fff;border-color:rgba(255,255,255,.35)">Strg N</kbd></button>
  </div>
  <div id="view"></div>
</main>

<div id="drop"><div>Dateien hier ablegen<br><span style="font-size:14px;color:#aab">Name, Typ und Größe werden automatisch erkannt</span></div></div>

<div class="ov" id="ov"><div class="modal" id="modal"></div></div>
<div id="toast"></div>

<script>
/* ---------- Icons ---------- */
const P={
 home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',
 doc:'<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h6"/>',
 xls:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/>',
 note:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
 mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
 web:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
 dir:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
 fav:'<path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
 sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
 moon:'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
 copy:'<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>',
 open:'<path d="M14 3h7v7M21 3l-9 9"/><path d="M19 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h5"/>',
 edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',
 shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'
};
const I=(n,s=18)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${P[n]}</svg>`;

const TYPES={
 doc:{name:'Dokumente',one:'Dokument',c:'var(--doc)',hash:'dokumente'},
 xls:{name:'Excel',one:'Excel-Datei',c:'var(--xls)',hash:'excel'},
 dir:{name:'Ordner',one:'Ordner',c:'var(--dir)',hash:'ordner'},
 note:{name:'Notizen',one:'Notiz',c:'var(--note)',hash:'notizen'},
 mail:{name:'E-Mail-Adressen',one:'E-Mail-Adresse',c:'var(--mail)',hash:'emails'},
 web:{name:'Webseiten',one:'Webseite',c:'var(--web)',hash:'webseiten'}
};
const QUICK_DIRS=[['Desktop','shell:Desktop'],['Dokumente','shell:Personal'],['Downloads','shell:Downloads'],['Bilder','shell:My Pictures'],['Videos','shell:My Video'],['Musik','shell:My Music'],['OneDrive','shell:OneDrive'],['Dieser PC','shell:MyComputerFolder'],['Zuletzt verwendet','shell:Recent'],['Papierkorb','shell:RecycleBinFolder']];
const cleanPath=s=>(s||'').trim().replace(/^"(.*)"$/,'$1').replace(/^'(.*)'$/,'$1').trim();
const isPcPath=s=>/^([A-Za-z]:\\|\\\\[^\\]|shell:|%[A-Za-z]+%)/.test(cleanPath(s));
const lastSeg=s=>{const p=cleanPath(s).replace(/[\\\/]+$/,'');const m=p.split(/[\\\/]/);return m[m.length-1]||p};
const hasExt=s=>/\.[A-Za-z0-9]{1,6}$/.test(lastSeg(s));
const fileUrl=s=>{let p=cleanPath(s).replace(/\\/g,'/');return encodeURI(p.startsWith('//')?'file:'+p:'file:///'+p).replace(/#/g,'%23')};
const LOCAL=location.protocol==='file:';
function pathActs(it){
  if(!it.path)return'';
  if(isUrl(it.path))return`<a class="act" href="${esc(fixUrl(it.path))}" target="_blank" rel="noopener">${I('open',13)} Öffnen</a>`;
  const open=LOCAL&&/^[A-Za-z]:|^\\\\/.test(cleanPath(it.path))?`<a class="act" href="${esc(fileUrl(it.path))}" target="_blank">${I('open',13)} Öffnen</a>`:`<button class="act" data-openpath="${it.id}">${I('open',13)} Öffnen</button>`;
  return open+`<button class="act" data-copy="${esc(cleanPath(it.path))}">${I('copy',13)} Pfad</button>`;
}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- State ---------- */
let items=[], view='home', group='', query='', db=null, mode='local';
const LS='bayazit-organizer-v1';
function lsGet(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
items=lsGet(LS,[]);

/* ---------- Storage (Claude-Datenbank, sonst lokal) ---------- */
function setStatus(){
  const s=document.getElementById('status');
  if(mode==='db'){s.className='status';s.innerHTML='<i></i>Gespeichert in deinem<br>Claude-Konto · privat';}
  else if(sync&&syncState==='ok'){s.className='status';s.innerHTML='<i></i>Abgleich mit GitHub aktiv<br>zuletzt '+new Date(syncTime).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})+' Uhr';}
  else if(sync&&syncState==='busy'){s.className='status';s.innerHTML='<i></i>Gleiche ab …';}
  else if(sync&&syncState==='err'){s.className='status local';s.innerHTML='<i></i>Abgleich fehlgeschlagen<br>'+esc(syncErr)+'';}
  else{s.className='status local';s.innerHTML='<i></i>Nur in diesem Browser<br>gespeichert – Abgleich einrichten!';}
}
function normDocs(snap){
  let arr=[];
  if(Array.isArray(snap))arr=snap;else if(snap&&Array.isArray(snap.docs))arr=snap.docs;else if(snap&&typeof snap.forEach==='function'){snap.forEach(d=>arr.push(d))}
  return arr.map(d=>{
    let data=d&&typeof d.data==='function'?d.data():(d&&d.data!==undefined?d.data:d);
    data=Object.assign({},data||{});

/* ---------- Browser-Abgleich über GitHub ---------- */
var sync=lsGet('bo-sync',null),tomb=lsGet('bo-tomb',{}),syncState='',syncErr='',syncTime=0,syncSha=null,pushTimer=null,syncBusy=false,syncAgain=false;
const SYNC_FILE='organizer-daten.json';
const b64e=s=>{const b=new TextEncoder().encode(s);let r='';for(let i=0;i<b.length;i+=0x8000)r+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(r)};
const b64d=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,'')),c=>c.charCodeAt(0)));
function ghUrl(){return`https://api.github.com/repos/${sync.repo}/contents/${SYNC_FILE}`}
function ghHead(extra){return Object.assign({'Authorization':'Bearer '+sync.token,'Accept':'application/vnd.github+json'},extra||{})}
async function ghPull(){
  const r=await fetch(ghUrl()+'?t='+Date.now(),{headers:ghHead(),cache:'no-store'});
  if(r.status===404){syncSha=null;return{items:[],tomb:{}}}
  if(r.status===401)throw new Error('Schlüssel (Token) ungültig');
  if(r.status===403)throw new Error('Keine Berechtigung');
  if(!r.ok)throw new Error('GitHub-Fehler '+r.status);
  const j=await r.json();syncSha=j.sha;let txt;
  if(j.content)txt=b64d(j.content);
  else{const r2=await fetch(ghUrl()+'?t='+Date.now(),{headers:ghHead({'Accept':'application/vnd.github.raw+json'}),cache:'no-store'});txt=await r2.text()}
  try{return JSON.parse(txt)}catch(e){return{items:[],tomb:{}}}
}
async function ghPush(data){
  const body={message:'Organizer-Abgleich '+new Date().toLocaleString('de-DE'),content:b64e(JSON.stringify(data))};
  if(syncSha)body.sha=syncSha;
  const r=await fetch(ghUrl(),{method:'PUT',headers:ghHead({'Content-Type':'application/json'}),body:JSON.stringify(body)});
  if(r.status===409||r.status===422)return false;
  if(r.status===404)throw new Error('Repo „'+sync.repo+'“ nicht gefunden');
  if(r.status===401)throw new Error('Schlüssel (Token) ungültig');
  if(r.status===403)throw new Error('Token darf nicht schreiben');
  if(!r.ok)throw new Error('GitHub-Fehler '+r.status);
  const j=await r.json();syncSha=j.content&&j.content.sha;return true;
}
function mergeData(remote){
  const t=Object.assign({},remote.tomb||{});for(const k in tomb)t[k]=Math.max(t[k]||0,tomb[k]);
  const map={};
  [...(remote.items||[]),...items].forEach(x=>{if(!x||!x.id||!x.type)return;const o=map[x.id];if(!o||(x.updated||0)>(o.updated||0))map[x.id]=x});
  const out=Object.values(map).filter(x=>!(t[x.id]&&t[x.id]>=(x.updated||0)));
  const cut=Date.now()-180*864e5;for(const k in t)if(t[k]<cut)delete t[k];
  return{items:out,tomb:t};
}
async function syncNow(manual){
  if(!sync||mode==='db')return;
  if(syncBusy){syncAgain=true;return}
  syncBusy=true;syncState='busy';setStatus();
  try{
    for(let tries=0;tries<3;tries++){
      const remote=await ghPull();
      const m=mergeData(remote);
      const changed=JSON.stringify(m.items.map(x=>x.id+':'+x.updated).sort())!==JSON.stringify(items.map(x=>x.id+':'+x.updated).sort());
      items=m.items;tomb=m.tomb;lsSet(LS,items);lsSet('bo-tomb',tomb);
      if(changed&&!document.getElementById('ov').classList.contains('on'))render();
      const remoteSame=JSON.stringify((remote.items||[]).map(x=>x.id+':'+x.updated).sort())===JSON.stringify(items.map(x=>x.id+':'+x.updated).sort());
      if(remoteSame&&syncSha)break;
      if(await ghPush({version:2,updated:Date.now(),items,tomb}))break;
    }
    syncState='ok';syncTime=Date.now();if(manual)toast('Abgleich fertig ✓ – '+items.length+' Einträge');
  }catch(e){syncState='err';syncErr=e.message||'Verbindung';if(manual)toast('Abgleich fehlgeschlagen: '+esc(syncErr),6000)}
  syncBusy=false;setStatus();
  if(syncAgain){syncAgain=false;syncNow()}
}
function schedulePush(){if(!sync||mode==='db')return;clearTimeout(pushTimer);pushTimer=setTimeout(()=>syncNow(),1500)}
window.addEventListener('focus',()=>{if(sync&&Date.now()-syncTime>5000)syncNow()});
setInterval(()=>{if(sync&&document.visibilityState==='visible')syncNow()},120000);

  document.getElementById('ov').classList.add('on');

  const repo=document.getElementById('syRepo').value.trim().replace(/^https?:\/\/github\.com\//,'').replace(/\/$/,'');

/* ---------- Dateien (Kopie im Browser-Speicher) ---------- */
const FDB=(()=>{let p;function open(){if(p)return p;p=new Promise((res,rej)=>{try{const r=indexedDB.open('bo-files',1);r.onupgradeneeded=()=>r.result.createObjectStore('files');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});return p}
  function tx(mode,fn){return open().then(db=>new Promise((res,rej)=>{const t=db.transaction('files',mode);const r=fn(t.objectStore('files'));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)}))}
  return{put:(id,f)=>tx('readwrite',s=>s.put(f,id)),get:id=>tx('readonly',s=>s.get(id)),del:id=>tx('readwrite',s=>s.delete(id))}})();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
const XLS_EXT=['xls','xlsx','xlsm','xlsb','csv','ods','numbers'];
const fileKind=n=>XLS_EXT.includes((n.split('.').pop()||'').toLowerCase())?'xls':'doc';
const baseName=n=>n.replace(/\.[^.]+$/,'');
const VIEWABLE=/\.(pdf|png|jpe?g|gif|webp|svg|txt)$/i;

function fileMeta(f){return{fileName:f.name,fileSize:f.size,fileModified:f.lastModified||Date.now(),hasFile:true}}
async function storeFile(id,f){try{await FDB.put(id,f);return true}catch(e){console.warn(e);return false}}
async function addFiles(files){
  let ok=0;
  for(const f of files){
    const id=uid();const stored=await storeFile(id,f);
    const it=Object.assign({id,type:fileKind(f.name),title:baseName(f.name),path:'',group:(TYPES[view]&&group)||'',text:'',fav:false,created:Date.now()},fileMeta(f));

    if(it.fileName)body+=`<div class="path" title="${esc(it.fileName)}">📎 ${esc(it.fileName)} · ${fmtSize(it.fileSize)}</div>`;
    if(it.path)body+=`<div class="path" title="${esc(it.path)}">${esc(it.path)}</div>`;
    if(it.hasFile){acts+=`<button class="act" data-openfile="${it.id}">${I('open',13)} Öffnen</button><button class="act" data-dlfile="${it.id}">⬇ Herunterladen</button>`;if(it.path)acts+=`<button class="act" data-copy="${esc(it.path)}">${I('copy',13)} Pfad</button>`}
    else acts+=pathActs(it);
  }else if(it.type==='dir'){
    body+=`<div class="path" title="${esc(it.path)}">${esc(it.path)}</div>`;acts+=pathActs(it);
  }else if(it.type==='mail'){
    body+=`<div class="path">${esc(it.path)}</div>`;
    acts+=`<button class="act" data-copy="${esc(it.path)}">${I('copy',13)} Adresse kopieren</button>`;
    if(it.extra)acts+=`<a class="act" href="${esc(fixUrl(it.extra))}" target="_blank" rel="noopener">${I('open',13)} Postfach</a>`;
  }else if(it.type==='web'){
    body+=`<div class="path">${esc((it.path||'').replace(/^https?:\/\//,''))}</div>`;
    if(it.path)acts+=`<a class="act" href="${esc(fixUrl(it.path))}" target="_blank" rel="noopener">${I('open',13)} Öffnen</a><button class="act" data-copy="${esc(fixUrl(it.path))}">${I('copy',13)} Link</button>`;
  }else if(it.type==='note'){
    acts+=`<button class="act" data-copy-note="${it.id}">${I('copy',13)} Text kopieren</button>`;
  }
  if(it.text)body+=`<div class="desc">${esc(it.text)}</div>`;
  return`<div class="item" style="--c:${T.c}">
    <div class="ih"><div class="ic">${I(it.type,17)}</div><div style="min-width:0"><div class="t" title="${esc(it.title)}">${esc(it.title)}</div><div class="g">${esc(it.group||T.one)}</div></div>
    <button class="star ${it.fav?'on':''}" data-fav="${it.id}" title="Favorit">${it.fav?'★':'☆'}</button></div>
    ${body}
    <div class="acts">${acts}<button class="act ml" data-edit="${it.id}">${I('edit',13)} Bearbeiten</button></div>
    <div class="meta">geändert ${when(it.updated)}</div>
  </div>`;
}

/* ---------- Clicks ---------- */
document.getElementById('view').addEventListener('click',e=>{
  const b=e.target.closest('button,[data-open]');if(!b)return;
  const d=b.dataset;
  if(d.v){go(d.v)}
  else if(d.new!==undefined){openEditor(null,d.new==='1'?(TYPES[view]?view:'doc'):d.new)}
  else if(d.g!==undefined){group=d.g;render()}
  else if(d.fav){const it=items.find(x=>x.id===d.fav);if(it){it.fav=!it.fav;save(it)}}
  else if(d.edit||d.open){openEditor(items.find(x=>x.id===(d.edit||d.open)))}
  else if(d.copy){copy(d.copy)}
  else if(d.copyNote){const it=items.find(x=>x.id===d.copyNote);copy(it.text||'','Notiz kopiert ✓')}
  else if(d.quick){copy(d.quick,'Kopiert ✓ – jetzt <kbd>Windows</kbd>+<kbd>R</kbd>, <kbd>Strg</kbd>+<kbd>V</kbd>, <kbd>Enter</kbd>',6000)}
  else if(d.openfile){openFile(d.openfile,false)}
  else if(d.dlfile){openFile(d.dlfile,true)}
  else if(d.openpath){const it=items.find(x=>x.id===d.openpath);copy(cleanPath(it.path),'Pfad kopiert ✓ – jetzt <kbd>Windows</kbd>+<kbd>R</kbd>, <kbd>Strg</kbd>+<kbd>V</kbd>, <kbd>Enter</kbd>',6000)}
});

/* ---------- Editor ---------- */
let edType='doc',edItem=null,pendingFile=null;
function setPending(f){
  if(!f)return;
  const cur=collect();pendingFile=f;edType=fileKind(f.name);
  drawEditor();
  const t=document.getElementById('fTitle');if(t&&!(cur.title||'').trim())t.value=baseName(f.name);
  toast('Erkannt: <b>'+esc(f.name)+'</b> → '+TYPES[edType].one+' ✓');
}
function fieldsFor(t,it){
  it=it||{};
  const g=[...new Set(items.filter(x=>x.type===t).map(x=>x.group).filter(Boolean))];
  const dl=`<datalist id="gl">${g.map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`;
  const grp=`<label>Gruppe / Ordner <span style="color:var(--dim);font-weight:400">(z. B. Steuer, Haus, Arbeit, Trading)</span></label><input class="f" id="fGroup" list="gl" value="${esc(it.group)}">${dl}`;
  if(t==='note')return`<label>Titel</label><input class="f" id="fTitle" value="${esc(it.title)}" placeholder="z. B. Ideen für die Shrinkflation-App">${grp}<label>Notiz</label><textarea class="f note" id="fText" placeholder="Schreib einfach los …">${esc(it.text)}</textarea>`;
  if(t==='mail')return`<label>E-Mail-Adresse</label><input class="f" id="fPath" value="${esc(it.path)}" placeholder="name@gmail.com"><label>Bezeichnung</label><input class="f" id="fTitle" value="${esc(it.title)}" placeholder="z. B. Privat, Trading, YouTube-Kanal">${grp}<label>Login-Seite / Postfach-Link</label><input class="f" id="fExtra" value="${esc(it.extra)}" placeholder="https://mail.google.com"><label>Notiz <span style="color:var(--dim);font-weight:400">(wofür, Anbieter … aber kein Passwort)</span></label><textarea class="f" id="fText">${esc(it.text)}</textarea><div class="warn">${I('shield',12)} Bitte keine Passwörter eintragen.</div>`;
  if(t==='dir')return`<label>Ordner-Pfad</label><input class="f" id="fPath" value="${esc(it.path)}" placeholder="C:\\Users\\Tekin\\Documents\\Steuer"><div style="font-size:12px;color:var(--dim);margin-top:6px">Im Explorer: Ordner mit Rechtsklick → <b>„Als Pfad kopieren“</b>, hier mit Strg + V einfügen.</div><label>Name</label><input class="f" id="fTitle" value="${esc(it.title)}" placeholder="z. B. Steuer-Unterlagen">${grp}<label>Notiz</label><textarea class="f" id="fText">${esc(it.text)}</textarea>`;
  if(t==='web')return`<label>Adresse (URL)</label><input class="f" id="fPath" value="${esc(it.path)}" placeholder="https://…"><label>Name</label><input class="f" id="fTitle" value="${esc(it.title)}" placeholder="z. B. Bayazit Wetter">${grp}<label>Notiz</label><textarea class="f" id="fText">${esc(it.text)}</textarea>`;
  const dz=`<div class="dz${it.fileName?' has':''}" id="dz">${it.fileName?`📎 <b>${esc(it.fileName)}</b> · ${fmtSize(it.fileSize)}<br><span>Andere Datei hineinziehen oder klicken, um sie zu ersetzen</span>`:`<b>Datei hier hineinziehen</b> oder klicken zum Auswählen<br><span>Name, Typ und Größe werden automatisch erkannt</span>`}<input type="file" id="dzIn" hidden></div>`;
  return`${dz}<label>Name</label><input class="f" id="fTitle" value="${esc(it.title)}" placeholder="${t==='xls'?'z. B. Kaffeekasse 2026':'z. B. Steuerbescheid 2024'}"><label>Speicherort – Pfad oder Link</label><input class="f" id="fPath" value="${esc(it.path)}" placeholder="C:\\Users\\Tekin\\Documents\\… oder OneDrive-/Google-Drive-Link"><div style="font-size:12px;color:var(--dim);margin-top:6px">Tipp: Im Explorer Datei mit Rechtsklick → <b>„Als Pfad kopieren“</b>, hier mit Strg + V einfügen.</div>${grp}<label>Notiz</label><textarea class="f" id="fText" placeholder="Worum geht es, was ist zu tun …">${esc(it.text)}</textarea>`;
}
function openEditor(it,type){
  edItem=it||null;edType=it?it.type:(type||'doc');
  drawEditor();
  document.getElementById('ov').classList.add('on');
  setTimeout(()=>{const f=document.getElementById(edType==='mail'||edType==='web'?'fPath':'fTitle');f&&f.focus()},50);
}
function drawEditor(){
  const m=document.getElementById('modal');
  m.className='modal'+(edType==='note'?' wide':'');
  const cur=collect();
  m.innerHTML=`<h2>${edItem?'Bearbeiten':'Neuer Eintrag'}</h2>
  ${edItem?'':`<div class="types">${Object.keys(TYPES).map(k=>`<button class="ty ${k===edType?'on':''}" style="--c:${TYPES[k].c}" data-ty="${k}">${I(k,20)}${TYPES[k].one.replace('-Adresse','').replace('-Datei','')}</button>`).join('')}</div>`}
  ${fieldsFor(edType,Object.assign({},edItem||{},cur,pendingFile?fileMeta(pendingFile):{}))}
  <div class="mfoot">${edItem?`<button class="btn sm danger" id="delBtn">Löschen</button>`:''}<span class="sp"></span>
  <button class="btn sm" id="cancelBtn">Abbrechen</button><button class="btn sm pri" id="saveBtn">Speichern <kbd style="background:rgba(255,255,255,.18);color:#fff;border-color:rgba(255,255,255,.35)">Strg ↵</kbd></button></div>`;
  const dz=document.getElementById('dz'),dzIn=document.getElementById('dzIn');
  if(dz){dz.onclick=()=>dzIn.click();dzIn.onchange=()=>setPending(dzIn.files[0])}
}
function collect(){const v=id=>{const el=document.getElementById(id);return el?el.value:undefined};const o={};[['title','fTitle'],['path','fPath'],['group','fGroup'],['text','fText'],['extra','fExtra']].forEach(([k,id])=>{const x=v(id);if(x!==undefined)o[k]=x});return o}
function closeEditor(){document.getElementById('ov').classList.remove('on');edItem=null;pendingFile=null}
function commit(){
  const c=collect();
  c.title=(c.title||'').trim();c.path=(c.path||'').trim();c.group=(c.group||'').trim();
  if(edType==='dir'||edType==='doc'||edType==='xls')c.path=cleanPath(c.path);
  if(!c.title&&edType==='dir')c.title=lastSeg(c.path);
  if(!c.title&&edType==='mail')c.title=c.path;
  if(!c.title&&edType==='web')c.title=c.path.replace(/^https?:\/\/(www\.)?/,'').split('/')[0];
  if(!c.title){toast('Bitte einen Namen eintragen.');return}
  const it=Object.assign({},edItem||{id:uid(),fav:false,created:Date.now()},c,{type:edType});
  const pf=pendingFile,wasEdit=!!edItem;
  if(pf&&(edType==='doc'||edType==='xls')){
    Object.assign(it,fileMeta(pf));closeEditor();
    storeFile(it.id,pf).then(ok=>{if(!ok){it.hasFile=false;toast('Eintrag gespeichert – die Datei selbst konnte hier nicht abgelegt werden.',5000)}save(it)});
    toast(wasEdit?'Gespeichert ✓':'Hinzugefügt ✓');return;
  }
  save(it);closeEditor();toast(wasEdit?'Gespeichert ✓':'Hinzugefügt ✓');
}
document.getElementById('modal').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.ty){edType=b.dataset.ty;drawEditor()}
  else if(b.id==='saveBtn')commit();
  else if(b.id==='cancelBtn')closeEditor();
  else if(b.id==='delBtn'){if(b.dataset.sure){const id=edItem.id;closeEditor();removeItem(id);toast('Gelöscht.')}else{b.dataset.sure=1;b.textContent='Wirklich löschen?'}}
  else if(b.id==='bkCopy'){copy(document.getElementById('bkOut').value,'Sicherung kopiert ✓ – z. B. in eine Textdatei einfügen und speichern.',5000)}
  else if(b.id==='bkImport'){doImport(document.getElementById('bkIn').value)}
  else if(b.id==='bkClose')closeEditor();
  else if(b.id==='syOn')connectSync();
  else if(b.id==='syNow'){closeEditor();syncNow(true)}
  else if(b.id==='syOff'){if(b.dataset.sure){sync=null;lsSet('bo-sync',null);try{localStorage.removeItem('bo-sync')}catch(e){};syncState='';closeEditor();setStatus();toast('Abgleich getrennt. Deine Einträge bleiben in diesem Browser.')}else{b.dataset.sure=1;b.textContent='Wirklich trennen?'}}
  else if(b.id==='bkFileSave')exportFile();
});
document.getElementById('ov').addEventListener('mousedown',e=>{if(e.target.id==='ov')closeEditor()});

/* ---------- Backup ---------- */
function openBackup(){
  const m=document.getElementById('modal');m.className='modal wide';
  m.innerHTML=`<h2>Sicherung</h2>
  <div class="hint" style="--c:var(--xls)">${mode==='db'?'Deine Einträge sind in deinem Claude-Konto gespeichert und auf jedem PC da, auf dem du angemeldet bist. Eine zusätzliche Sicherung schadet trotzdem nicht.':'Deine Einträge liegen gerade nur in diesem Browser. Mach regelmäßig eine Sicherung!'}</div>
  <label>1. Sichern – Text kopieren und als Datei speichern (z. B. <b>organizer-sicherung.txt</b>)</label>
  <textarea class="f" id="bkOut" readonly style="min-height:120px;font-family:var(--mono);font-size:12px">${esc(JSON.stringify(items))}</textarea>
  <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm pri" id="bkFileSave">⬇ Als Datei speichern (mit hineingezogenen Dateien)</button><button class="btn sm" id="bkCopy">${I('copy',14)} Nur Text kopieren</button></div>
  ${mode==='db'?'<div class="warn">In Claude ist das Speichern als Datei gesperrt – nutze hier „Nur Text kopieren“.</div>':''}
  <label style="margin-top:20px">2. Wiederherstellen – Sicherungsdatei wählen (wird sofort eingelesen) oder Text einfügen</label>
  <input type="file" id="bkFile" accept=".txt,.json" class="f">
  <textarea class="f" id="bkIn" style="min-height:90px;font-family:var(--mono);font-size:12px;margin-top:8px" placeholder="Sicherungstext hier einfügen …"></textarea>
  <div class="mfoot"><span class="sp"></span><button class="btn sm" id="bkClose">Schließen</button><button class="btn sm pri" id="bkImport">Einlesen</button></div>`;
  document.getElementById('ov').classList.add('on');
  document.getElementById('bkFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>doImport(r.result);r.readAsText(f)});
}
async function exportFile(){
  const files={};let nf=0;
  for(const it of items){if(!it.hasFile)continue;try{const f=await FDB.get(it.id);if(!f)continue;
    const data=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(f)});
    files[it.id]={name:f.name||it.fileName,type:f.type||'',data};nf++}catch(e){}}
  const blob=new Blob([JSON.stringify({app:'Bayazit Organizer',version:2,created:Date.now(),items,files})],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='organizer-sicherung-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),60000);
  toast(`Sicherung gespeichert ✓ – ${items.length} Einträge, ${nf} Dateien. Im anderen Browser unter „Sicherung → Datei wählen“ einlesen.`,6500);
}
async function doImport(txt){
  let data;try{data=JSON.parse(txt)}catch(e){toast('Das ist keine gültige Sicherung.');return}
  const arr=Array.isArray(data)?data:(data&&Array.isArray(data.items)?data.items:null);
  if(!arr){toast('Das ist keine gültige Sicherung.');return}
  const files=(data&&data.files)||{};
  let n=0,u=0,nf=0;
  for(const x of arr){
    if(!x||!x.id||!x.type||!TYPES[x.type])continue;
    const ex=items.find(y=>y.id===x.id);
    if(files[x.id]){try{const fd=files[x.id];const bin=Uint8Array.from(atob(fd.data),c=>c.charCodeAt(0));if(await storeFile(x.id,new File([bin],fd.name,{type:fd.type})))nf++}catch(e){}}
    if(!ex){items.push(x);n++}else if((x.updated||0)>(ex.updated||0)){Object.assign(ex,x);u++}
  }
  lsSet(LS,items);
  if(db&&mode==='db'){for(const x of items){try{await db.doc('items/'+x.id).set(x)}catch(e){}}}
  schedulePush();render();closeEditor();
  toast(`Eingelesen ✓ – ${n} neu, ${u} aktualisiert${nf?', '+nf+' Dateien':''}`,5000);
}

/* ---------- Drag & Drop ---------- */
let dragN=0;const drop=document.getElementById('drop');
window.addEventListener('dragenter',e=>{if([...(e.dataTransfer.types||[])].includes('Files')){dragN++;drop.classList.add('on')}});
window.addEventListener('dragleave',()=>{dragN=Math.max(0,dragN-1);if(!dragN)drop.classList.remove('on')});
window.addEventListener('dragover',e=>e.preventDefault());
window.addEventListener('drop',e=>{
  e.preventDefault();dragN=0;drop.classList.remove('on');
  const files=[...(e.dataTransfer.files||[])].filter(f=>f.size>0||/\./.test(f.name));if(!files.length)return;
  const ovOn=document.getElementById('ov').classList.contains('on');
  if(ovOn&&document.getElementById('fTitle')&&(edType==='doc'||edType==='xls'||!edItem)){setPending(files[0]);return}
  if(ovOn)return;
  addFiles(files);
});

/* ---------- Einfügen mit Strg + V: Pfade, Links, E-Mails ---------- */
document.addEventListener('paste',e=>{
  if(document.getElementById('ov').classList.contains('on'))return;
  if(/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;
  const txt=(e.clipboardData&&e.clipboardData.getData('text'))||'';
  const lines=txt.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);if(!lines.length)return;
  const made=[];
  lines.forEach(l=>{
    const p=cleanPath(l);let it=null;
    if(isPcPath(p)){const t=hasExt(p)?fileKind(p):'dir';it={type:t,title:t==='dir'?lastSeg(p):baseName(lastSeg(p)),path:p}}
    else if(/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(p))it={type:'mail',title:p,path:p};
    else if(isUrl(p))it={type:'web',title:fixUrl(p).replace(/^https?:\/\/(www\.)?/,'').split('/')[0],path:fixUrl(p)};
    if(it){Object.assign(it,{id:uid(),group:(TYPES[view]&&group)||'',text:'',fav:false,created:Date.now()});save(it,true);made.push(it)}
  });
  if(!made.length){toast('Nichts erkannt – füge einen Pfad (C:\\…), einen Link oder eine E-Mail-Adresse ein.');return}
  e.preventDefault();render();
  const names={doc:'Dokument',xls:'Excel-Datei',dir:'Ordner',mail:'E-Mail-Adresse',web:'Webseite'};
  toast(made.length===1?`${names[made[0].type]} „${esc(made[0].title)}“ hinzugefügt ✓`:`${made.length} Einträge hinzugefügt ✓`);
});

/* ---------- Theme, Suche, Tasten ---------- */
function applyTheme(light){document.body.classList.toggle('light',light);document.getElementById('themeIc').innerHTML=I(light?'moon':'sun',17);document.getElementById('themeTx').textContent=light?'Dunkel':'Hell';lsSet('bo-theme',light)}
applyTheme(lsGet('bo-theme',false));
document.getElementById('themeBtn').onclick=()=>applyTheme(!document.body.classList.contains('light'));
document.getElementById('backupBtn').onclick=openBackup;
function setSide(c){document.body.classList.toggle('col',c);lsSet('bo-side',c)}
setSide(lsGet('bo-side',false));
document.getElementById('sideBtn').onclick=()=>setSide(!document.body.classList.contains('col'));
document.getElementById('syncBtn').onclick=openSync;
document.getElementById('syIc').innerHTML=I('web',17);
if(sync)setTimeout(()=>{if(mode!=='db')syncNow()},1500);
document.getElementById('bkIc').innerHTML=I('shield',17);
document.getElementById('sIc').innerHTML='<span style="color:var(--mut)">'+I('search',18)+'</span>';
document.getElementById('addIc').innerHTML=I('plus',18);
document.getElementById('addBtn').onclick=()=>openEditor(null,TYPES[view]?view:'doc');
const q=document.getElementById('q');
q.addEventListener('input',()=>{query=q.value.trim();render()});
document.addEventListener('keydown',e=>{
  const ov=document.getElementById('ov').classList.contains('on');
  const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if(e.ctrlKey&&e.key.toLowerCase()==='b'){e.preventDefault();setSide(!document.body.classList.contains('col'))}
  else if(e.ctrlKey&&e.key.toLowerCase()==='k'){e.preventDefault();q.focus();q.select()}
  else if(e.ctrlKey&&e.key.toLowerCase()==='n'){e.preventDefault();openEditor(null,TYPES[view]?view:'doc')}
  else if(e.key==='Escape'){if(ov)closeEditor();else if(query){q.value='';query='';render()}}
  else if(ov&&e.ctrlKey&&e.key==='Enter'&&document.getElementById('saveBtn')){e.preventDefault();commit()}
  else if(!typing&&!ov&&!e.ctrlKey&&!e.altKey){
    const map={'1':'home','2':'doc','3':'xls','4':'dir','5':'note','6':'mail','7':'web','8':'fav'};
    if(map[e.key])go(map[e.key]);else if(e.key.toLowerCase()==='t')applyTheme(!document.body.classList.contains('light'));
  }
});
setInterval(()=>{const c=document.getElementById('clk');if(c)c.textContent=new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})},20000);
render();
